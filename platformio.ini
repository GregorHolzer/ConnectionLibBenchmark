; One firmware, all three backends, two roles.
;
; Unlike the pingpong example - which builds a separate binary per backend - this benchmark
; enables ESP-NOW, LoRa and Zigbee in a *single* image and picks between them at run time, in
; response to CFG commands arriving over the USB serial link. That is not a stylistic choice: a
; 10h campaign visits several hundred configuration points, and a rebuild plus two flashes costs
; ~80s, so build-time configuration would spend most of the campaign flashing rather than
; measuring. With runtime configuration the whole campaign needs exactly two flashes.
;
; Nothing in ConnectionLib had to change to allow this. Destroying a Transport and constructing a
; new one re-runs setup(), and all three backends tear down cleanly (~EspNowTransport calls
; esp_now_deinit(), ZigbeeTransport re-begin()s its UART, LoRaTransport re-begin()s the radio).
;
; Release mode is deliberate and load-bearing: docs/benchmarking-practices.md P6 forbids
; benchmarking debug builds, and verify_practices.py checks the build flags for it.

[env]
platform = espressif32
board = ttgo-t-beam
framework = arduino
monitor_speed = 115200
build_unflags = -std=gnu++11
lib_ldf_mode = deep+
lib_deps =
    symlink://./ConnectionLib
    jgromes/RadioLib@^6
    lewisxhe/XPowersLib@^0.2
    andrewrapp/XBee
    olikraus/U8g2@^2
; The two -I flags work around a PlatformIO LDF limitation: RadioLib.h isn't found when included
; from inside another library (ConnectionLib) rather than this project's own src/, and RadioLib's
; sources fail to resolve the framework's bundled SPI.h for themselves.
build_flags =
    -std=gnu++17
    -DCONNECTIONLIB_ENABLE_ESPNOW
    -DCONNECTIONLIB_ENABLE_LORA
    -DCONNECTIONLIB_ENABLE_ZIGBEE
    -I.pio/libdeps/$PIOENV/RadioLib/src
    -I$PROJECT_PACKAGES_DIR/framework-arduinoespressif32/libraries/SPI/src

[env:bench_gateway]
build_flags =
    ${env.build_flags}
    -DBENCH_ROLE_GATEWAY

[env:bench_node]
build_flags =
    ${env.build_flags}
    -DBENCH_ROLE_NODE

; Field mode, docs/field-campaign.md. BENCH_ROLE_* is the board's part in the exchange, not its
; name: the field node carries the laptop and runs the measured loop, so it is the ROLE_GATEWAY
; build; the field gateway only answers, so it is the ROLE_NODE build. The field gateway must be
; the board with the Zigbee coordinator (docs/hardware.md), as on the bench.
[env:field_node]
build_flags =
    ${env.build_flags}
    -DBENCH_ROLE_GATEWAY
    -DBENCH_FIELD_NODE

[env:field_gateway]
build_flags =
    ${env.build_flags}
    -DBENCH_ROLE_NODE
    -DBENCH_FIELD_GATEWAY
