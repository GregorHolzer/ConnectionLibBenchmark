; Two firmwares from one source tree: the node (src/node.cpp, src/NodeLoRa.cpp) and the gateway
; (src/gateway.cpp).
;
; The configuration point is fixed at build time. bench.py writes include/bench_config.h and
; re-flashes the node for every point; the gateway is flashed once. Only the files that include
; that header recompile, so a new point costs seconds, not a full build.
;
; Release mode is deliberate: docs/benchmarking-practices.md P6 forbids benchmarking debug builds.

[env]
platform = espressif32
board = ttgo-t-beam
framework = arduino
monitor_speed = 115200
build_unflags = -std=gnu++11
lib_ldf_mode = deep+
lib_deps =
    symlink://./ConnectionLib
    jgromes/RadioLib@^6
    lewisxhe/XPowersLib@^0.2
    andrewrapp/XBee
; The two -I flags work around a PlatformIO LDF limitation: RadioLib.h isn't found when included
; from inside another library (ConnectionLib) rather than this project's own src/, and RadioLib's
; sources fail to resolve the framework's bundled SPI.h for themselves.
build_flags =
    -std=gnu++17
    -DCONNECTIONLIB_ENABLE_ESPNOW
    -DCONNECTIONLIB_ENABLE_LORA
    -DCONNECTIONLIB_ENABLE_ZIGBEE
    -I.pio/libdeps/$PIOENV/RadioLib/src
    -I$PROJECT_PACKAGES_DIR/framework-arduinoespressif32/libraries/SPI/src

[env:node]
build_src_filter = +<*> -<gateway.cpp>

[env:gateway]
build_src_filter = +<*> -<node.cpp> -<NodeLoRa.cpp>
build_flags =
    ${env.build_flags}
    -DBENCH_GATEWAY
